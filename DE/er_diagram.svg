<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="100%" height="100%" style="background:#0f172a; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
    <marker id="crow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 6 L 0 11 M 10 1 L 10 11" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="490" y="40" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700" letter-spacing="0.5">
    Ledger Expense Tracker — Entity-Relationship (ER) Diagram
  </text>
  <text x="490" y="65" text-anchor="middle" fill="#94a3b8" font-size="13">
    Relational Data Model • PostgreSQL • Strong Consistency Architecture
  </text>

  <!-- ENTITY: USERS -->
  <g transform="translate(60, 110)" filter="url(#shadow)">
    <rect width="240" height="190" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <rect width="240" height="38" rx="8" fill="#2563eb"/>
    <rect y="30" width="240" height="8" fill="#2563eb"/>
    <text x="120" y="24" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">USERS (1)</text>
    
    <!-- Attributes -->
    <text x="16" y="65" fill="#facc15" font-size="12" font-family="monospace" font-weight="700">PK</text>
    <text x="44" y="65" fill="#f1f5f9" font-size="12">id</text>
    <text x="175" y="65" fill="#94a3b8" font-size="11">SERIAL</text>
    <line x1="12" y1="76" x2="228" y2="76" stroke="#334155" stroke-width="1"/>

    <text x="16" y="98" fill="#38bdf8" font-size="12" font-family="monospace" font-weight="700">UK</text>
    <text x="44" y="98" fill="#f1f5f9" font-size="12">email</text>
    <text x="145" y="98" fill="#94a3b8" font-size="11">VARCHAR(255)</text>
    <line x1="12" y1="109" x2="228" y2="109" stroke="#334155" stroke-width="1"/>

    <text x="44" y="131" fill="#f1f5f9" font-size="12">name</text>
    <text x="145" y="131" fill="#94a3b8" font-size="11">VARCHAR(100)</text>
    <line x1="12" y1="142" x2="228" y2="142" stroke="#334155" stroke-width="1"/>

    <text x="44" y="164" fill="#f1f5f9" font-size="12">createdAt</text>
    <text x="150" y="164" fill="#94a3b8" font-size="11">TIMESTAMP(3)</text>
  </g>

  <!-- ENTITY: CATEGORIES -->
  <g transform="translate(60, 360)" filter="url(#shadow)">
    <rect width="240" height="170" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect width="240" height="38" rx="8" fill="#059669"/>
    <rect y="30" width="240" height="8" fill="#059669"/>
    <text x="120" y="24" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">CATEGORIES (1)</text>

    <!-- Attributes -->
    <text x="16" y="65" fill="#facc15" font-size="12" font-family="monospace" font-weight="700">PK</text>
    <text x="44" y="65" fill="#f1f5f9" font-size="12">id</text>
    <text x="175" y="65" fill="#94a3b8" font-size="11">SERIAL</text>
    <line x1="12" y1="76" x2="228" y2="76" stroke="#334155" stroke-width="1"/>

    <text x="16" y="98" fill="#38bdf8" font-size="12" font-family="monospace" font-weight="700">UK</text>
    <text x="44" y="98" fill="#f1f5f9" font-size="12">name</text>
    <text x="150" y="98" fill="#94a3b8" font-size="11">VARCHAR(60)</text>
    <line x1="12" y1="109" x2="228" y2="109" stroke="#334155" stroke-width="1"/>

    <text x="44" y="131" fill="#f1f5f9" font-size="12">icon</text>
    <text x="150" y="131" fill="#94a3b8" font-size="11">VARCHAR(50)</text>
  </g>

  <!-- ENTITY: EXPENSES (CENTRAL) -->
  <g transform="translate(380, 140)" filter="url(#shadow)">
    <rect width="280" height="340" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="2.5"/>
    <rect width="280" height="42" rx="8" fill="#7c3aed"/>
    <rect y="34" width="280" height="8" fill="#7c3aed"/>
    <text x="140" y="26" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">EXPENSES (N)</text>

    <!-- Attributes -->
    <text x="16" y="68" fill="#facc15" font-size="12" font-family="monospace" font-weight="700">PK</text>
    <text x="44" y="68" fill="#f1f5f9" font-size="12" font-weight="600">id</text>
    <text x="210" y="68" fill="#94a3b8" font-size="11">SERIAL</text>
    <line x1="12" y1="79" x2="268" y2="79" stroke="#334155" stroke-width="1"/>

    <text x="16" y="101" fill="#ec4899" font-size="11" font-family="monospace" font-weight="700">FK</text>
    <text x="44" y="101" fill="#f1f5f9" font-size="12">user_id</text>
    <text x="180" y="101" fill="#94a3b8" font-size="11">INT (Nullable)</text>
    <line x1="12" y1="112" x2="268" y2="112" stroke="#334155" stroke-width="1"/>

    <text x="44" y="134" fill="#f1f5f9" font-size="12">title</text>
    <text x="205" y="134" fill="#94a3b8" font-size="11">TEXT NOT NULL</text>
    <line x1="12" y1="145" x2="268" y2="145" stroke="#334155" stroke-width="1"/>

    <text x="44" y="167" fill="#f1f5f9" font-size="12" font-weight="600">amount</text>
    <text x="175" y="167" fill="#38bdf8" font-size="11" font-weight="600">INT (in paise)</text>
    <line x1="12" y1="178" x2="268" y2="178" stroke="#334155" stroke-width="1"/>

    <text x="44" y="200" fill="#f1f5f9" font-size="12">type</text>
    <text x="175" y="200" fill="#94a3b8" font-size="11">TEXT (EXPENSE)</text>
    <line x1="12" y1="211" x2="268" y2="211" stroke="#334155" stroke-width="1"/>

    <text x="44" y="233" fill="#f1f5f9" font-size="12">category</text>
    <text x="205" y="233" fill="#94a3b8" font-size="11">TEXT NOT NULL</text>
    <line x1="12" y1="244" x2="268" y2="244" stroke="#334155" stroke-width="1"/>

    <text x="44" y="266" fill="#f1f5f9" font-size="12">date</text>
    <text x="180" y="266" fill="#94a3b8" font-size="11">TIMESTAMP(3)</text>
    <line x1="12" y1="277" x2="268" y2="277" stroke="#334155" stroke-width="1"/>

    <text x="44" y="299" fill="#f1f5f9" font-size="12">createdAt</text>
    <text x="180" y="299" fill="#94a3b8" font-size="11">TIMESTAMP(3)</text>
    <line x1="12" y1="310" x2="268" y2="310" stroke="#334155" stroke-width="1"/>

    <text x="44" y="325" fill="#f1f5f9" font-size="12">updatedAt</text>
    <text x="180" y="325" fill="#94a3b8" font-size="11">TIMESTAMP(3)</text>
  </g>

  <!-- ENTITY: EXPENSE_TAGS (JUNCTION TABLE FOR M:N) -->
  <g transform="translate(730, 180)" filter="url(#shadow)">
    <rect width="200" height="130" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <rect width="200" height="34" rx="8" fill="#d97706"/>
    <rect y="26" width="200" height="8" fill="#d97706"/>
    <text x="100" y="22" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">EXPENSE_TAGS</text>

    <!-- Attributes -->
    <text x="12" y="58" fill="#facc15" font-size="11" font-family="monospace">PK,FK</text>
    <text x="56" y="58" fill="#f1f5f9" font-size="11">expense_id</text>
    <text x="150" y="58" fill="#94a3b8" font-size="10">INT</text>
    <line x1="10" y1="68" x2="190" y2="68" stroke="#334155" stroke-width="1"/>

    <text x="12" y="88" fill="#facc15" font-size="11" font-family="monospace">PK,FK</text>
    <text x="56" y="88" fill="#f1f5f9" font-size="11">tag_id</text>
    <text x="150" y="88" fill="#94a3b8" font-size="10">INT</text>
    <line x1="10" y1="98" x2="190" y2="98" stroke="#334155" stroke-width="1"/>

    <text x="12" y="116" fill="#94a3b8" font-size="10" font-style="italic">Resolves M:N relation</text>
  </g>

  <!-- ENTITY: TAGS -->
  <g transform="translate(730, 360)" filter="url(#shadow)">
    <rect width="200" height="120" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
    <rect width="200" height="34" rx="8" fill="#0891b2"/>
    <rect y="26" width="200" height="8" fill="#0891b2"/>
    <text x="100" y="22" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">TAGS (M)</text>

    <!-- Attributes -->
    <text x="12" y="58" fill="#facc15" font-size="11" font-family="monospace">PK</text>
    <text x="40" y="58" fill="#f1f5f9" font-size="11">id</text>
    <text x="145" y="58" fill="#94a3b8" font-size="10">SERIAL</text>
    <line x1="10" y1="68" x2="190" y2="68" stroke="#334155" stroke-width="1"/>

    <text x="12" y="88" fill="#38bdf8" font-size="11" font-family="monospace">UK</text>
    <text x="40" y="88" fill="#f1f5f9" font-size="11">name</text>
    <text x="110" y="88" fill="#94a3b8" font-size="10">VARCHAR(50)</text>
  </g>

  <!-- RELATIONSHIP LINES -->
  <!-- Users (1) -> Expenses (N) -->
  <path d="M 300 200 L 380 240" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#crow)"/>
  <rect x="315" y="200" width="46" height="20" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="338" y="214" text-anchor="middle" fill="#38bdf8" font-size="10" font-weight="700">1 : N</text>

  <!-- Categories (1) -> Expenses (N) -->
  <path d="M 300 440 L 380 380" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#crow)"/>
  <rect x="315" y="405" width="46" height="20" rx="4" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
  <text x="338" y="419" text-anchor="middle" fill="#34d399" font-size="10" font-weight="700">1 : N</text>

  <!-- Expenses (1) -> Expense_Tags (N) -->
  <path d="M 660 250 L 730 250" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#crow)"/>
  <rect x="675" y="240" width="40" height="18" rx="4" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>
  <text x="695" y="253" text-anchor="middle" fill="#fbbf24" font-size="9" font-weight="700">1 : N</text>

  <!-- Tags (1) -> Expense_Tags (N) -->
  <path d="M 830 360 L 830 310" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#crow)"/>
  <rect x="810" y="328" width="40" height="18" rx="4" fill="#0f172a" stroke="#22d3ee" stroke-width="1"/>
  <text x="830" y="341" text-anchor="middle" fill="#22d3ee" font-size="9" font-weight="700">1 : N</text>

  <!-- Legend -->
  <g transform="translate(60, 560)">
    <rect width="860" height="42" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="26" fill="#94a3b8" font-size="12" font-weight="600">LEGEND:</text>
    <text x="90" y="26" fill="#facc15" font-family="monospace" font-size="12" font-weight="700">PK</text>
    <text x="112" y="26" fill="#cbd5e1" font-size="12">Primary Key</text>
    <text x="210" y="26" fill="#ec4899" font-family="monospace" font-size="12" font-weight="700">FK</text>
    <text x="232" y="26" fill="#cbd5e1" font-size="12">Foreign Key</text>
    <text x="330" y="26" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700">UK</text>
    <text x="352" y="26" fill="#cbd5e1" font-size="12">Unique Key</text>
    <text x="460" y="26" fill="#38bdf8" font-size="12">• 1:N (One-to-Many)</text>
    <text x="610" y="26" fill="#fbbf24" font-size="12">• M:N resolved via Associative Table</text>
  </g>
</svg>
